<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .subscribe-button{
        background-color: pink;

        border: none;
        width: 100px;
        height: 50px;
        border-radius:30px;
        cursor: pointer;
        margin-right: 440px ;
        padding:200px;
      }

      .join-button{
       width: 100px;

        height: 50px;
      }

</head>

    <button class="subscribe-button">subscribe</button>
    <button class="join-button">join</button>
    <button class="tweet-button">tweet</button>

</body>
</html>
