<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        a{
            color: rgb(0,113,133);
        }

        .b1{
            width: 100px;
            height: 30px;
            background-color: rgb(255,216,0);
            color: black;
            border: none;
            border-radius: 30px;
        }

        .b1:hover{
          background-color: rgb(216, 185, 3);   
        }

        .b1:active{
            background-color: rgb(250, 226, 88);
        }

        .p1{
            color: rgb(0,118,0);
        }


         #b2{
            width: 100px;
            height: 30px;
            background-color: rgb(255,164,20);
            color: black;
            border: none;
            border-radius: 30px;
        }

        #b2:hover{
              background-color: rgb(255, 159, 6);
        }

        #b2:active{
              background-color: rgb(251, 187, 84);
        }
    </style>
</head>
<body>
    <a href="https://amazon.com">back to amazon</a>
    <br>
    <h2>Nike Black Running Shoes</h2>
    <br>
    <p class="p1">$39 - in stock</p>
    <br>
    <p>free delivery tomorrow.</p>
    <br>
    <button class="b1">add to cart</button>
    <button id="b2">Buy now</button>
</body>
</html>
