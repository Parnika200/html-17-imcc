<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .subscribe-button{
        background-color: pink;
        color: blueviolet;
        border: none;
        padding: 20px;
        border-radius:30px;
        cursor: pointer;
       
       
      }

      .join-button{
       padding: 10px;
       background-color: blue;
       color: white;
       width: 100px;
       border-radius: 30px;

      }

      .tweet-button{
        background-color: yellowgreen;
        border: 10px;
        border-radius: 40px;
        color: pink;
        padding: 20px;
        width: 90px;
      }
    </style>
</head>
<body>
    <button class="subscribe-button">subscribe</button>
    <button class="join-button">join</button>
    <button class="tweet-button">tweet</button>

</body>
</html>
